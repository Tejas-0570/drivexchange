spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # a brand-new empty database has no tables; 'validate' would crash
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

drivexchange:
  booking:
    percent: 2
    min-rupees: 5000
    max-rupees: 50000
    platform-fee-percent: 1
    expiry-minutes: 15

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${FRONTEND_URL}