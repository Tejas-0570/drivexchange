services:
  postgres:
    image: postgres:15
    container_name: drivexchange-postgres
    environment:
      POSTGRES_DB: drivexchange_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: drivexchangepass
    ports:
      - "5434:5432"
    volumes:
      - drivexchange_pgdata:/var/lib/postgresql/data


volumes:
  drivexchange_pgdata:
